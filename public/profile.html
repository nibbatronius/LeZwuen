<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>LeZwuen | Profile</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">LeZwuen</span>
      </div>
      <nav class="site-nav">
        <a class="nav-link" href="home.html">Home</a>
      </nav>
      <div class="profile-slot">
        <a class="avatar-link" href="profile.html" aria-label="Go to profile">
          <img
            class="avatar"
            src="avatar-placeholder.svg"
            alt="Profile avatar"
            data-avatar-img
          />
        </a>
        <label class="avatar-edit" aria-label="Upload profile photo">
          <input class="avatar-input" type="file" accept="image/*" data-avatar-input />
          <span aria-hidden="true">+</span>
        </label>
        <span class="upload-status" data-upload-status aria-live="polite"></span>
      </div>
    </header>
    <main class="app-layout">
      <section class="profile-card">
        <img
          class="profile-avatar-large"
          src="avatar-placeholder.svg"
          alt="Profile avatar"
          data-avatar-img
        />
        <div class="profile-details">
          <div class="profile-field">
            <div class="profile-field-label">Display name</div>
            <div class="profile-field-row">
              <span class="profile-field-value" data-profile-value="display_name">Loading...</span>
              <button
                class="icon-button"
                type="button"
                data-profile-edit="display_name"
                aria-label="Edit display name"
              >
                Edit
              </button>
            </div>
            <div class="profile-field-editor" data-profile-editor="display_name" hidden>
              <input
                type="text"
                maxlength="32"
                autocomplete="nickname"
                data-profile-input="display_name"
              />
              <div class="profile-field-actions">
                <button class="ghost" type="button" data-profile-save="display_name">Save</button>
                <button class="ghost" type="button" data-profile-cancel="display_name">Cancel</button>
              </div>
            </div>
          </div>
          <div class="profile-field">
            <div class="profile-field-label">Email</div>
            <div class="profile-field-row">
              <span class="profile-field-value" data-profile-value="email">Loading...</span>
              <button
                class="icon-button"
                type="button"
                data-profile-edit="email"
                aria-label="Edit email"
              >
                Edit
              </button>
            </div>
            <div class="profile-field-editor" data-profile-editor="email" hidden>
              <input type="email" autocomplete="email" data-profile-input="email" />
              <div class="profile-field-actions">
                <button class="ghost" type="button" data-profile-save="email">Save</button>
                <button class="ghost" type="button" data-profile-cancel="email">Cancel</button>
              </div>
            </div>
          </div>
          <div class="profile-field">
            <div class="profile-field-label">Account type</div>
            <div class="profile-field-row">
              <span class="profile-tag" data-profile-value="account_type">Guest</span>
            </div>
          </div>
          <div class="profile-status" data-profile-status aria-live="polite"></div>
        </div>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="user.js"></script>
  </body>
</html>
