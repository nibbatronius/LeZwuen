<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>LeZwuen | Expense Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">LeZwuen</span>
      </div>
      <nav class="site-nav">
        <a class="nav-link" href="home.html">Home</a>
        <a class="nav-link" href="messages.html">Messages</a>
        <details class="nav-dropdown">
          <summary class="nav-link active">Services</summary>
          <div class="nav-dropdown-menu">
            <a class="nav-dropdown-link" href="profit.html">Profit calculator</a>
            <a class="nav-dropdown-link active" href="expense.html">Expense tracker</a>
            <a class="nav-dropdown-link" href="sales.html">Sales tracker</a>
            <a class="nav-dropdown-link" href="notes.html">Post-it notes</a>
          </div>
        </details>
      </nav>
      <div class="profile-slot">
        <a class="avatar-link" href="profile.html" aria-label="Go to profile">
          <img
            class="avatar"
            src="avatar-placeholder.svg"
            alt="Profile avatar"
            data-avatar-img
          />
        </a>
        <label class="avatar-edit" aria-label="Upload profile photo">
          <input class="avatar-input" type="file" accept="image/*" data-avatar-input />
          <span aria-hidden="true">+</span>
        </label>
        <span class="upload-status" data-upload-status aria-live="polite"></span>
      </div>
    </header>
    <main class="app-layout app-layout-expense">
      <section class="expense-shell">
        <section class="expense-panel">
          <div class="expense-panel-header">
            <div>
              <div class="expense-title">Expense tracker</div>
              <div class="expense-subtitle">Log expenses and track cash going out.</div>
            </div>
            <button class="ghost" type="button" data-expense-reset>Clear all</button>
          </div>
          <div class="expense-field">
            <label class="expense-field-label" for="expense-currency">Currency</label>
            <select class="expense-select" id="expense-currency" data-expense-currency></select>
          </div>
          <form class="expense-form" data-expense-form>
            <div class="expense-field">
              <label class="expense-field-label" for="expense-name">Expense name</label>
              <input
                id="expense-name"
                class="expense-input"
                type="text"
                placeholder="Packaging materials"
                data-expense-name
              />
            </div>
            <div class="expense-field">
              <label class="expense-field-label" for="expense-amount">Amount</label>
              <div class="expense-money-field">
                <span class="expense-currency-prefix" data-expense-currency-prefix>USD</span>
                <input
                  id="expense-amount"
                  type="text"
                  inputmode="decimal"
                  placeholder="0.00"
                  data-expense-amount
                />
              </div>
            </div>
            <div class="expense-field">
              <label class="expense-field-label" for="expense-category">Category</label>
              <select id="expense-category" class="expense-select" data-expense-category>
                <option value="Inventory">Inventory</option>
                <option value="Marketing">Marketing</option>
                <option value="Operations">Operations</option>
                <option value="Shipping">Shipping</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="expense-field">
              <label class="expense-field-label" for="expense-date">Date</label>
              <input id="expense-date" class="expense-input" type="date" data-expense-date />
            </div>
            <div class="expense-actions">
              <button class="primary" type="submit">Add expense</button>
            </div>
            <div class="expense-status" data-expense-status aria-live="polite"></div>
          </form>
          <div class="expense-summary">
            <div class="expense-summary-card">
              <div class="expense-summary-label">Total spent</div>
              <div class="expense-summary-value" data-expense-total>--</div>
            </div>
            <div class="expense-summary-card">
              <div class="expense-summary-label">Entries</div>
              <div class="expense-summary-value" data-expense-count>--</div>
            </div>
          </div>
          <div class="expense-list" data-expense-list></div>
        </section>
        <section class="expense-panel">
          <div class="expense-panel-header">
            <div>
              <div class="expense-title">Profit sync</div>
              <div class="expense-subtitle">Charting expenses against sales profit.</div>
            </div>
            <button class="ghost" type="button" data-profit-refresh>Refresh</button>
          </div>
          <div class="expense-chart">
            <div class="expense-chart-bars">
              <div class="expense-chart-column">
                <div class="expense-chart-stack">
                  <span class="expense-chart-fill" data-profit-bar="invested"></span>
                </div>
                <div class="expense-chart-label">Invested</div>
                <div class="expense-chart-value" data-profit-value="invested">--</div>
              </div>
              <div class="expense-chart-column">
                <div class="expense-chart-stack">
                  <span class="expense-chart-fill" data-profit-bar="profit"></span>
                </div>
                <div class="expense-chart-label">Profit</div>
                <div class="expense-chart-value" data-profit-value="profit">--</div>
              </div>
            </div>
          </div>
          <div class="expense-profit-meta">
            <span class="expense-profit-status" data-profit-status>Waiting for profit data.</span>
            <span class="expense-profit-updated" data-profit-updated></span>
          </div>
        </section>
      </section>
    </main>
    <script src="config.js"></script>
    <script src="shared-data.js"></script>
    <script src="expense.js"></script>
    <script src="user.js"></script>
  </body>
</html>
