<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>LeZwuen Forum</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">LeZwuen</span>
      </div>
      <nav class="site-nav">
        <a class="nav-link" href="nearby.html">Nearby</a>
        <a class="nav-link" href="code-of-conduct.html">Code of Conduct</a>
      </nav>
      <div class="profile-slot">
        <a class="avatar-link" href="profile.html" aria-label="Go to profile">
          <img
            class="avatar"
            src="avatar-placeholder.svg"
            alt="Profile avatar"
            data-avatar-img
          />
        </a>
        <label class="avatar-edit" aria-label="Upload profile photo">
          <input class="avatar-input" type="file" accept="image/*" data-avatar-input />
          <span aria-hidden="true">+</span>
        </label>
        <span class="upload-status" data-upload-status aria-live="polite"></span>
      </div>
    </header>
    <main class="app-layout"></main>
    <script src="config.js"></script>
    <script src="user.js"></script>
  </body>
</html>
