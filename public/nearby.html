<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LeZwuen Forum | Nearby</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">LeZwuen</span>
      </div>
      <nav class="site-nav">
        <a class="nav-link active" href="nearby.html">Nearby</a>
        <a class="nav-link" href="code-of-conduct.html">Code of Conduct</a>
      </nav>
      <div class="profile-slot">
        <a class="avatar-link" href="profile.html" aria-label="Go to profile">
          <img class="avatar" src="avatar-placeholder.svg" alt="Profile avatar" data-avatar-img />
        </a>
        <label class="avatar-edit" aria-label="Upload profile photo">
          <input class="avatar-input" type="file" accept="image/*" data-avatar-input />
          <span aria-hidden="true">+</span>
        </label>
        <span class="upload-status" data-upload-status aria-live="polite"></span>
      </div>
    </header>

    <main class="nearby-layout">
      <aside class="nearby-sidebar">
        <div class="nearby-sidebar-header">
          <h2>Nearby</h2>
          <p>Distance rooms</p>
        </div>
        <div class="nearby-status" data-location-status>
          Share your location to unlock nearby rooms.
        </div>
        <button class="ghost" type="button" data-share-location>Share location</button>
        <div class="room-list" data-room-list></div>
      </aside>

      <section class="nearby-chat">
        <header class="chat-header">
          <div>
            <h2 data-room-title>Choose a room</h2>
            <p data-room-subtitle>Distance buckets keep your exact location private.</p>
          </div>
          <div class="chat-meta">
            <span class="presence-dot"></span>
            <span data-room-presence>0 active</span>
          </div>
        </header>

        <div class="chat-log" data-chat-log></div>

        <form class="chat-composer" data-chat-form>
          <input
            type="text"
            name="message"
            placeholder="Message the room (no buy/sell/trade)"
            autocomplete="off"
            maxlength="500"
            required
          />
          <button class="primary" type="submit">Send</button>
        </form>
      </section>
    </main>

    <div class="age-gate" data-age-gate hidden>
      <div class="age-card">
        <h2>Confirm your age</h2>
        <p>You must be 18+ to access Nearby chat.</p>
        <label class="age-check">
          <input type="checkbox" data-age-checkbox />
          I confirm I am 18 or older.
        </label>
        <button class="primary" type="button" data-age-confirm>Continue</button>
      </div>
    </div>

    <script src="config.js"></script>
    <script src="nearby.js"></script>
    <script src="user.js"></script>
  </body>
</html>
