<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>LeZwuen</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="auth-body">
    <main class="layout">
      <section class="card">
        <div class="auth-tabs">
          <button type="button" class="tab active" data-tab="login">Log in</button>
          <button type="button" class="tab" data-tab="signup">Sign up</button>
        </div>

        <form id="login-form" class="auth-form active" data-form="login" autocomplete="on">
          <label>
            Email
            <input type="email" name="email" placeholder="you@lezwuen.com" autocomplete="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="********" autocomplete="current-password" required />
          </label>
          <div class="form-message" role="status" aria-live="polite"></div>
          <button class="primary" type="submit">Log in</button>
        </form>

        <form id="signup-form" class="auth-form" data-form="signup" autocomplete="on">
          <label>
            Display name
            <input
              type="text"
              name="displayName"
              placeholder="Your name"
              autocomplete="nickname"
              maxlength="32"
              required
            />
          </label>
          <label>
            Email
            <input type="email" name="email" placeholder="you@lezwuen.com" autocomplete="email" required />
          </label>
          <label>
            Password
            <input type="password" name="password" placeholder="8+ characters" autocomplete="new-password" required />
          </label>
          <div class="form-message" role="status" aria-live="polite"></div>
          <button class="primary" type="submit">Create account</button>
        </form>
      </section>
    </main>
    <div class="age-gate" data-age-gate hidden>
      <div class="age-card">
        <h2>Age verification</h2>
        <p>You must be 18 or older to create a LeZwuen account.</p>
        <label class="age-check">
          <input type="checkbox" data-age-checkbox />
          I confirm that I am 18 or older.
        </label>
        <button class="primary" type="button" data-age-confirm>Continue</button>
      </div>
    </div>
    <script src="config.js"></script>
    <script src="crypto.js"></script>
    <script src="app.js"></script>
  </body>
</html>
