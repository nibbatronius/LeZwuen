<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <title>LeZwuen | Profit Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="app-body">
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-text">LeZwuen</span>
      </div>
      <nav class="site-nav">
        <a class="nav-link active" href="profit-calculator.html">Profit Calculator</a>
      </nav>
      <div class="profile-slot">
        <a class="avatar-link" href="profile.html" aria-label="Go to profile">
          <img class="avatar" src="avatar-placeholder.svg" alt="Profile avatar" data-avatar-img />
        </a>
        <label class="avatar-edit" aria-label="Upload profile photo">
          <input class="avatar-input" type="file" accept="image/*" data-avatar-input />
          <span aria-hidden="true">+</span>
        </label>
        <span class="upload-status" data-upload-status aria-live="polite"></span>
      </div>
    </header>

    <main class="app-layout">
      <section class="embed-card">
        <div class="embed-header">
          <div>
            <h1>Profit Calculator</h1>
            <p>Live financial modeling via the embedded calculator service.</p>
          </div>
          <a class="ghost" href="profile.html">Back to profile</a>
        </div>
        <div class="embed-frame">
          <div class="embed-placeholder" data-embed-placeholder>
            Set `PROFIT_CALC_URL` in `public/config.js` to load the calculator.
          </div>
          <iframe
            title="Profit calculator"
            data-profit-embed
            loading="lazy"
            referrerpolicy="no-referrer"
          ></iframe>
        </div>
      </section>
    </main>

    <script src="config.js"></script>
    <script src="embed.js"></script>
    <script src="user.js"></script>
  </body>
</html>
